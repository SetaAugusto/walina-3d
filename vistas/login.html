<!doctype html>

<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Walina 3D</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
  <link rel="icon" href="/images/favicon.png" type="image/png">
</head>
<body class="bg-light">
  
  <main class="container d-flex align-items-center justify-content-center" style="min-height: 100vh">
   
    <form id="form-login" class="card shadow-sm w-100" style="max-width: 380px">
      <div class="card-body p-4">
        
        <img src="/images/logo.png" alt="Walina 3D" width="120" height="120" class="d-block mx-auto mb-2">
        <h1 class="h4 mb-4 text-center">Panel de pedidos</h1>

       
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input type="text" class="form-control" id="usuario" autocomplete="username" required>
        </div>
        
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" autocomplete="current-password" required>
        </div>

       
        <div class="alert alert-danger d-none" id="error" role="alert"></div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
      </div>
    </form>
  </main>

 
  <script>
   
    document.getElementById('form-login').addEventListener('submit', async (evento) => {
     
      evento.preventDefault();
     
      const error = document.getElementById('error');

     
      const respuesta = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          usuario: document.getElementById('usuario').value.trim(),
          password: document.getElementById('password').value
        })
      });

      if (respuesta.ok) {
        
        location.href = '/admin/pedidos.html';
      } else {
        
        error.textContent = (await respuesta.json()).error;
        error.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
